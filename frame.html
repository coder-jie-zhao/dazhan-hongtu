<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>手机框</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .wrap { width: 466px; height: 968px; padding: 10px; }
  .phone {
    width: 446px; height: 948px; border-radius: 52px; padding: 12px;
    background: linear-gradient(155deg, #3B3532, #141110 52%, #2B2624);
    box-shadow:
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.16),
      inset 0 0 0 3px rgba(0, 0, 0, 0.55);
    position: relative;
  }
  .screen {
    width: 422px; height: 924px; border-radius: 41px; overflow: hidden;
    background: #FBF9F5; position: relative;
  }
  iframe {
    position: absolute; top: 0; left: 0; width: 430px; height: 932px; border: 0;
    transform: scale(0.98140); transform-origin: top left;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="screen"><iframe id="f" src="about:blank"></iframe></div>
  </div>
</div>
<script>
  const v = new URLSearchParams(location.search).get("view") || "home";
  document.getElementById("f").src = "index.html?view=" + v + "&demo=1&embed=1";
</script>
</body>
</html>
