<!-- ============ 图 1：一次提问的处理链路 ============ -->
<div class="fig" id="fig-rag">
<svg width="586" height="232" viewBox="0 0 586 232">
  <rect x="12" y="30" width="118" height="70" fill="#FAFBFD" stroke="#C9D2DD"/>
  <text x="24" y="50" font-size="9.7" fill="#8A96A4" letter-spacing="1">学 生 侧</text>
  <text x="24" y="71" font-size="14" font-weight="bold" fill="#12264A">提出问题</text>
  <text x="24" y="88" font-size="10.2" fill="#5A6570">可自由提问</text>

  <line x1="132" y1="65" x2="150" y2="65" stroke="#A8B4C2" stroke-width="1.2"/>
  <polygon points="150,61 157,65 150,69" fill="#A8B4C2"/>

  <rect x="158" y="30" width="118" height="70" fill="#F7F9FC" stroke="#1B3A5C"/>
  <text x="170" y="50" font-size="9.7" fill="#8A96A4" letter-spacing="1">第 二 层</text>
  <text x="170" y="71" font-size="14" font-weight="bold" fill="#12264A">检索层</text>
  <text x="170" y="88" font-size="10.2" fill="#5A6570">18 条语料中检索</text>

  <line x1="278" y1="65" x2="296" y2="65" stroke="#A8B4C2" stroke-width="1.2"/>
  <polygon points="296,61 303,65 296,69" fill="#A8B4C2"/>

  <rect x="304" y="30" width="118" height="70" fill="#F7F9FC" stroke="#C9D2DD"/>
  <text x="316" y="50" font-size="9.7" fill="#8A96A4" letter-spacing="1">第 三 层</text>
  <text x="316" y="71" font-size="14" font-weight="bold" fill="#12264A">生成层</text>
  <text x="316" y="88" font-size="10.2" fill="#5A6570">按角色语气重述</text>

  <line x1="424" y1="65" x2="442" y2="65" stroke="#A8B4C2" stroke-width="1.2"/>
  <polygon points="442,61 449,65 442,69" fill="#A8B4C2"/>

  <rect x="450" y="30" width="124" height="70" fill="#12264A"/>
  <text x="462" y="50" font-size="9.7" fill="#9FB0C6" letter-spacing="1">交 付</text>
  <text x="462" y="71" font-size="14" font-weight="bold" fill="#FFFFFF">回答 + 来源</text>
  <text x="462" y="88" font-size="10.2" fill="#C3CEDD">每条都注明出处</text>

  <line x1="217" y1="100" x2="217" y2="128" stroke="#C4868A" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="213,128 217,134 221,128" fill="#C4868A"/>
  <rect x="112" y="140" width="210" height="56" fill="#FBF4F4" stroke="#9E2A2B"/>
  <text x="124" y="158" font-size="10.2" font-weight="bold" fill="#9E2A2B" letter-spacing="1">未 命 中</text>
  <text x="124" y="176" font-size="12" font-weight="bold" fill="#12264A">拒答，并引导学生向教师提问</text>
  <text x="124" y="189" font-size="9.7" fill="#8A6A6A">不猜测、不补全、不转述网络说法</text>

  <text x="290" y="119" font-size="9" fill="#8A96A4" text-anchor="middle">命中</text>
  <text x="205" y="119" font-size="9" fill="#9E2A2B" text-anchor="end">未命中</text>

  <line x1="12" y1="210" x2="574" y2="210" stroke="#E4E9EF"/>
  <text x="12" y="226" font-size="11" fill="#3A4654">模型<tspan font-weight="bold" fill="#9E2A2B">拿不到</tspan>语料之外的任何材料——不是被要求「不要编」，而是检索不到就生成不出来。</text>
</svg>
</div>
